version: 2

sources:
  - name: raw
    description: >
      Landing zone. Loaded from the S3 Parquet partitions by COPY INTO on Snowflake
      (infra/snowflake/03_load_raw.sql), or by apple_pricing.ingest.load_duckdb locally.
    schema: raw
    tables:
      - name: apple_prices
        description: One row per marketplace listing snapshot (Kaggle, 2020-09 to 2026-07).
        columns:
          - name: observation_date
            data_tests: [not_null]
          - name: model_name
            data_tests: [not_null]
          - name: current_price_usd
            data_tests: [not_null]

  - name: ml
    description: >
      Written by the Python forecasting job (apple_pricing.forecasting.train) after the
      first dbt pass. Models that read it are tagged `ml` and built in a second pass.
    schema: ml
    tables:
      - name: forecast_latest
        description: Latest 7- and 30-day P10/P50/P90 forecast for every platform x model x condition series.
      - name: forecast_backtest
        description: Out-of-sample test-period predictions used for the reported metrics.
