name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install "dbt-core>=1.10" "dbt-duckdb>=1.9" duckdb pandas pyarrow numpy catboost pytest
          pip install -e .

      - name: Unit tests
        run: pytest -q

      - name: Extract and load raw data into DuckDB
        run: |
          python -m apple_pricing.ingest.extract
          python -m apple_pricing.ingest.load_duckdb

      - name: dbt build (models + tests, excluding ML marts)
        working-directory: dbt
        env:
          DUCKDB_PATH: ../warehouse/apple_pricing.duckdb
        run: dbt build --profiles-dir . --exclude tag:ml
