<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pipeline Architecture</title>
<style>
  body { margin: 0; background: #ffffff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#898781"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="20" font-weight="600" fill="#0b0b0b">Pipeline architecture</text>
  <text x="24" y="58" font-size="13" fill="#52514e">One codebase: production runs on AWS S3 + Snowflake; development and CI run the same dbt models on DuckDB.</text>

  <!-- Stage boxes -->
  <g font-size="13" fill="#52514e">
    <rect x="24" y="96" width="170" height="118" rx="10" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="40" y="124" font-size="15" font-weight="600" fill="#0b0b0b">Source</text>
    <text x="40" y="148">Kaggle CSV</text>
    <text x="40" y="168">80,000 listings</text>
    <text x="40" y="188">31 models · 2 platforms</text>

    <rect x="224" y="96" width="170" height="118" rx="10" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
    <text x="240" y="124" font-size="15" font-weight="600" fill="#0b0b0b">AWS S3</text>
    <text x="240" y="148">Parquet, partitioned</text>
    <text x="240" y="168">by year=YYYY</text>
    <text x="240" y="188">least-privilege IAM</text>

    <rect x="424" y="96" width="170" height="118" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="440" y="124" font-size="15" font-weight="600" fill="#0b0b0b">Snowflake</text>
    <text x="440" y="148">storage integration</text>
    <text x="440" y="168">COPY INTO RAW</text>
    <text x="440" y="188">RBAC roles</text>

    <rect x="624" y="96" width="210" height="118" rx="10" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.5"/>
    <text x="640" y="124" font-size="15" font-weight="600" fill="#0b0b0b">dbt</text>
    <text x="640" y="148">staging → intermediate</text>
    <text x="640" y="168">star schema → marts</text>
    <text x="640" y="188">64 data tests</text>

    <rect x="864" y="96" width="310" height="118" rx="10" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="880" y="124" font-size="15" font-weight="600" fill="#0b0b0b">Machine learning (Python)</text>
    <text x="880" y="148">CatBoost 7- and 30-day forecasts</text>
    <text x="880" y="168">P10 / P50 / P90, conformal calibration</text>
    <text x="880" y="188">written back to the warehouse</text>
  </g>

  <!-- Main flow arrows -->
  <g stroke="#898781" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="194" y1="155" x2="222" y2="155"/>
    <line x1="394" y1="155" x2="422" y2="155"/>
    <line x1="594" y1="155" x2="622" y2="155"/>
    <line x1="834" y1="155" x2="862" y2="155"/>
    <!-- ML back to dbt ML marts -->
    <path d="M1019 214 L1019 250 L729 250 L729 276"/>
    <!-- dbt down to marts -->
    <line x1="680" y1="214" x2="680" y2="274"/>
  </g>
  <text x="780" y="243" font-size="12" fill="#898781">deal scores · backtest (dbt ML marts)</text>

  <!-- Marts band -->
  <rect x="424" y="278" width="410" height="54" rx="10" fill="#f0efec" stroke="#c3c2b7"/>
  <text x="440" y="302" font-size="14" font-weight="600" fill="#0b0b0b">Analytics &amp; ML data marts</text>
  <text x="440" y="321" font-size="12" fill="#52514e">platform gap · sale events · depreciation · successor launch · deal scores</text>

  <!-- Consumers -->
  <g stroke="#898781" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M520 332 L520 360 L300 360 L300 368"/>
    <line x1="629" y1="332" x2="629" y2="368"/>
    <path d="M740 332 L740 360 L960 360 L960 368"/>
  </g>

  <g font-size="13" fill="#52514e">
    <rect x="150" y="370" width="300" height="50" rx="10" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="166" y="392" font-size="14" font-weight="600" fill="#0b0b0b">Streamlit dashboard</text>
    <text x="166" y="410">9 tabs · buy-now / wait finder</text>

    <rect x="479" y="370" width="300" height="50" rx="10" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="495" y="392" font-size="14" font-weight="600" fill="#0b0b0b">Claude AI analyst</text>
    <text x="495" y="410">plain-English questions → safe SQL</text>

    <rect x="810" y="370" width="300" height="50" rx="10" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="826" y="392" font-size="14" font-weight="600" fill="#0b0b0b">Power BI</text>
    <text x="826" y="410">star schema via REPORTER role</text>
  </g>

  <!-- Dev / CI note -->
  <rect x="24" y="278" width="370" height="54" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-dasharray="0"/>
  <text x="40" y="302" font-size="14" font-weight="600" fill="#0b0b0b">Dev &amp; CI: DuckDB</text>
  <text x="40" y="321" font-size="12" fill="#52514e">same dbt models + tests · GitHub Actions on every push</text>
</svg>
</body>
</html>
